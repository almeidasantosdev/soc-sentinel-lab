id: 4e4efe35-ad4f-5dc9-9bf5-5997e9bd2caa
name: Força bruta em entradas do Entra ID
description: |
  Esta consulta identifica uma mesma conta com muitas falhas de entrada
  a partir do mesmo endereço IP. O padrão é compatível com adivinhação
  de senha contra uma identidade conhecida.
  Códigos ignorados: 0 é sucesso; 50125 e 50140 são interrupções de
  registro de senha ou de "manter conectado", não falha de credencial.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 30m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
  - T1110.001
query: |
  let failureThreshold = 10;
  SigninLogs
  | where ResultType !in ("0", "50125", "50140")
  | where isnotempty(UserPrincipalName) and isnotempty(IPAddress)
  | summarize
      FailureCount = count(),
      Applications = make_set(AppDisplayName, 5),
      ResultTypes = make_set(ResultType, 5),
      Locations = make_set(Location, 5),
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated)
      by UserPrincipalName, IPAddress
  | where FailureCount >= failureThreshold
  | extend
      Name = tostring(split(UserPrincipalName, "@")[0]),
      UPNSuffix = tostring(split(UserPrincipalName, "@")[1]),
      FailureCountText = tostring(FailureCount),
      ApplicationsText = strcat_array(Applications, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
      - identifier: Name
        columnName: Name
      - identifier: UPNSuffix
        columnName: UPNSuffix
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  FailureCount: FailureCountText
  Applications: ApplicationsText
alertDetailsOverride:
  alertDisplayNameFormat: "Força bruta de {{UserPrincipalName}} via {{IPAddress}}"
  alertDescriptionFormat: "{{FailureCountText}} falhas de entrada para a mesma conta e o mesmo IP."
eventGroupingSettings:
  aggregationKind: AlertPerResult
falsePositives: |
  Conta legítima que errou a senha várias vezes, cliente móvel com senha
  antiga e teste de autenticação de uma aplicação conhecida. Confirme se
  houve sucesso posterior a partir de um IP habitual antes de escalar.
version: 1.0.0
kind: Scheduled
