id: a905eaf9-305a-5ba2-9fcc-d0e4c99efb9f
name: Password spray em entradas do Entra ID
description: |
  Esta consulta identifica um mesmo endereço IP com falhas de entrada
  contra muitas contas distintas em uma janela curta. O padrão é
  compatível com password spray, em que poucas senhas são testadas
  em várias identidades para evitar o bloqueio de uma conta só.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
  - T1110.003
query: |
  let userThreshold = 8;
  let failureThreshold = 8;
  SigninLogs
  | where ResultType !in ("0", "50125", "50140")
  | where isnotempty(IPAddress) and isnotempty(UserPrincipalName)
  | summarize
      FailedUsers = dcount(UserPrincipalName),
      FailureCount = count(),
      Users = make_set(UserPrincipalName, 20),
      Applications = make_set(AppDisplayName, 5),
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated)
      by IPAddress
  | where FailedUsers >= userThreshold and FailureCount >= failureThreshold
  | extend
      AccountCustomEntity = tostring(Users[0]),
      Name = tostring(split(tostring(Users[0]), "@")[0]),
      UPNSuffix = tostring(split(tostring(Users[0]), "@")[1]),
      FailedUsersText = tostring(FailedUsers),
      SampleUsers = strcat_array(Users, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountCustomEntity
      - identifier: Name
        columnName: Name
      - identifier: UPNSuffix
        columnName: UPNSuffix
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  FailedUsers: FailedUsersText
  SampleUsers: SampleUsers
alertDetailsOverride:
  alertDisplayNameFormat: "Password spray a partir de {{IPAddress}}"
  alertDescriptionFormat: "{{FailedUsersText}} contas distintas falharam a partir do mesmo IP."
eventGroupingSettings:
  aggregationKind: SingleAlert
falsePositives: |
  NAT corporativo com muitas contas e senha expirada no mesmo dia,
  portal de troca de senha e laboratório de autenticação. Compare o
  IP com a lista de saída conhecida da empresa antes de tratar como ataque.
version: 1.0.0
kind: Scheduled
